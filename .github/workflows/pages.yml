name: Publish site to GitHub Pages

# GitHub Pages serves this repository from the `gh-pages` branch, which holds a
# copy of `docs/` at its root. This workflow refreshes that branch whenever
# `docs/` changes on `main`, so the published site tracks the source.
#
# Note: the Pages *site* itself is enabled once in repository settings. Enabling
# it from a workflow needs a token permission that installation tokens do not
# carry, so that stays a one-time manual step.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/ to the gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp -r docs/. /tmp/site/
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
